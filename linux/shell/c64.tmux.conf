# tmux-Konfiguration fuer den C64-Rahmen (frame.sh). Eigener Server je Tab (-L c64-<pid>),
# darum gilt sie nur dort und beruehrt kein ~/.tmux.conf.
#
# Kein Praefix, keine Statuszeile: tmux ist hier nur der Rahmen, alle Tasten gehen an
# Claude Code. Die Trennlinien tragen die Rahmenfarbe (ANSI 12 = hellblau im Profil "C64").

set -g status off
set -g prefix None
set -g prefix2 None
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g history-limit 5000
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g set-clipboard on
set -g allow-passthrough on
set -g window-size latest
set -g detach-on-destroy on
set -g remain-on-exit off
set -g display-time 1
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status off
set -g pane-border-style "fg=colour12,bg=colour12"
set -g pane-active-border-style "fg=colour12,bg=colour12"
set -g message-style "fg=colour12,bg=default"
set -g mode-style "fg=default,bg=colour12"
